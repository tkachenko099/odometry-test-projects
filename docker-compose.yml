# Reproducible run/CI companion to the devcontainer (Section 21 of the plan).
#
#   Allow local X clients once:  xhost +local:docker
#   Interactive dev shell:       docker compose run --rm dev
#   Full experiment (headless):  docker compose run --rm dev \
#                                  ./scripts/run_experiment.sh configs/gnss_outage_30s.yaml
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: dev
        USER_UID: "1000"
        USER_GID: "1000"
        LLVM_VERSION: "19"
    image: ugv-nav-stand:jazzy-harmonic
    container_name: ugv-nav-stand
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DISTRO: jazzy
      GZ_VERSION: harmonic
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - .:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri:rw
      - ugv-build-cache:/workspace/ros2_ws/build
      - ugv-ccache:/home/dev/.cache
    # Uncomment to expose an NVIDIA GPU (requires nvidia-container-toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    working_dir: /workspace
    command: bash

volumes:
  ugv-build-cache:
  ugv-ccache:
